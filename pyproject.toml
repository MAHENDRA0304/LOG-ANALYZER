[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "loganalyzer"
version = "1.0.0"
description = "Command-line tool to analyze Apache/Nginx, syslog and application logs"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
keywords = ["logs", "log-analysis", "cli", "security", "devops"]
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Environment :: Console",
    "Topic :: System :: Logging",
]
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=7"]

[project.scripts]
loganalyzer = "loganalyzer.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
